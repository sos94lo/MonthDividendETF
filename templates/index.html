<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Dividend ETFs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .table-container { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Monthly Dividend ETF Tracker</h1>
        <div class="table-container">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Ticker</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Yield</th>
                        <th>Last Dividend</th>
                    </tr>
                </thead>
                <tbody>
                    {% for etf in etfs %}
                    <tr>
                        <td><strong>{{ etf.ticker }}</strong></td>
                        <td>{{ etf.name }}</td>
                        <td>${{ etf.price }}</td>
                        <td>{{ etf.yield }}</td>
                        <td>{{ etf.last_dividend }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
